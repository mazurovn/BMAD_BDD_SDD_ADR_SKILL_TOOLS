<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MAZU-ADGILE</title>
<style>
  :root { --bg:#f4f1ea; --ink:#241f29; --muted:#6d6474; --card:#fffdf9; --line:#e6ddd2; --sage:#d9eed4; --blush:#f8d6d4; --lilac:#e6def6; --sand:#f6e6c4; --sky:#d7e8f6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  button, input, select, textarea { font:inherit; color:var(--ink); }
  button { cursor:pointer; }
  .app { display:grid; grid-template-columns:220px 1fr 340px; min-height:100vh; }
  nav { background:#2c2834; color:#f6f1ea; padding:1rem; }
  nav h1 { font-size:1.15rem; margin:.2rem 0 1rem; }
  nav button { display:block; width:100%; text-align:left; background:transparent; color:inherit; border:0; border-radius:10px; padding:.55rem .7rem; margin:.15rem 0; }
  nav button.active { background:#443e50; }
  main { padding:1rem 1.1rem 2rem; }
  aside { background:var(--card); border-left:1px solid var(--line); padding:1rem; }
  h2 { margin:.2rem 0 .8rem; font-size:1.25rem; }
  .muted, p { color:var(--muted); }
  .row { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; }
  input, select, textarea { background:white; border:1px solid var(--line); border-radius:10px; padding:.45rem .6rem; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:.5rem; margin:.8rem 0; }
  .stat, .panel, .card, .col { background:var(--card); border:1px solid var(--line); border-radius:14px; }
  .stat { padding:.7rem .8rem; } .stat b { display:block; font-size:1.4rem; }
  .board { display:grid; grid-template-columns:repeat(5,minmax(160px,1fr)); gap:.6rem; }
  .col { padding:.55rem; min-height:120px; background:#fbf7f2; }
  .card { padding:.7rem; margin:.4rem 0; cursor:pointer; }
  .card .id { color:var(--muted); font-size:.75rem; }
  .pill { border-radius:999px; padding:.05rem .45rem; font-size:.72rem; background:var(--sand); }
  .backlog { background:var(--sand);} .ready { background:var(--sky);} .in-progress { background:var(--lilac);} .review { background:var(--blush);} .done { background:var(--sage);} .no { background:var(--blush);} .ok { background:var(--sage);} .skip { background:#eee; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:14px; overflow:hidden; }
  th, td { text-align:left; padding:.5rem; border-bottom:1px solid var(--line); vertical-align:top; }
  tr { cursor:pointer; }
  .slice { border:1px solid var(--line); border-radius:12px; padding:.7rem; margin:.5rem 0; background:#fff; }
  svg { max-width:100%; height:auto; }
  #toast { position:fixed; bottom:1rem; right:1rem; background:#2c2834; color:white; padding:.7rem .9rem; border-radius:12px; display:none; max-width:420px; }
  @media (max-width:1000px) { .app { grid-template-columns:1fr; } aside { border-left:0; } .board, .stats { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <h1>MAZU-ADGILE</h1>
    <p id="sub" class="muted"></p>
    <button type="button" id="view-backlog">Бэклог</button>
    <button type="button" id="view-kanban" class="active">Доска</button>
    <button type="button" id="view-scrum">Спринт</button>
    <button type="button" id="view-cycle">Цикл</button>
    <button type="button" id="view-architecture">Архитектура</button>
    <button type="button" id="view-intake">Сырьё</button>
  </nav>
  <main>
    <div class="row">
      <input id="q" placeholder="поиск id, названия, цитаты" />
      <select id="kind"><option value="">все виды</option><option>idea</option><option>epic</option><option>story</option><option>task</option><option>requirement</option><option>adr</option></select>
      <select id="sprint"></select>
      <button id="reload" type="button">обновить</button>
    </div>
    <section class="stats" id="stats"></section>
    <p id="gaps"></p>
    <h2 id="view-title">Доска</h2>
    <section id="view"></section>
  </main>
  <aside id="drawer"><p class="muted">Выберите карточку.</p></aside>
</div>
<div id="toast"></div>
<script id="boot" type="application/json">__BOOT__</script>
<script>
const STATUSES = ["backlog", "ready", "in-progress", "review", "done"];
const boot = JSON.parse(document.getElementById("boot").textContent);
let state = boot;
let view = "kanban";
let openId = null;
function escapeHtml(value) {
  return String(value == null ? "" : value).replace(/[&<>"]/g, function (char) {
    return {"&":"\u0026","<":"\u003c",">":"\u003e","\"":"\u0022"}[char];
  });
}
function toast(text) { const el = document.getElementById("toast"); el.textContent = text; el.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.display = "none"; }, 3200); }
async function call(path, body) {
  if (!state.live) { toast("Это снимок. Запись: python3 cli/mazu.py serve"); return; }
  const response = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const payload = await response.json();
  if (!response.ok) { toast(payload.error || "ошибка"); return; }
  state = payload; draw();
}
function hoursOf(id) { return Number((state.hours || {})[id] || 0); }
function stagesOf(id) { return (state.cycle || {})[id] || []; }
function blocked(id) { return (state.blocked || {})[id] || []; }
function itemBy(id) { return state.store.items.find(item => item.id === id); }
function childrenOf(id) { return state.store.items.filter(item => item.parent === id); }
function visibleItems() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const kind = document.getElementById("kind").value;
  return state.store.items.filter(item => {
    if (kind && item.kind !== kind) return false;
    if (!q) return true;
    return (item.id + " " + item.title + " " + (item.description || "")).toLowerCase().includes(q);
  });
}
function cardHtml(item) {
  const blocks = blocked(item.id);
  const missing = stagesOf(item.id).filter(step => step.state === "no").map(step => step.name);
  return `<article class="card" data-open="${escapeHtml(item.id)}">
    <div class="id">${escapeHtml(item.id)} · ${escapeHtml(item.kind)}${item.parent ? " · " + escapeHtml(item.parent) : ""}</div>
    <strong>${escapeHtml(item.title)}</strong>
    <div class="row">
      <span class="pill ${escapeHtml(item.status)}">${escapeHtml(item.status)}</span>
      <span class="pill">${item.points == null ? "без SP" : item.points + " SP"}</span>
      <span class="pill">${hoursOf(item.id)} ч</span>
      ${item.sprint ? `<span class="pill">${escapeHtml(item.sprint)}</span>` : ""}
      ${blocks.length ? `<span class="pill no">гейт ${blocks.length}</span>` : ""}
      ${missing.length ? `<span class="pill no">${escapeHtml(missing.join(", "))}</span>` : ""}
    </div>
  </article>`;
}
function drawDrawer() {
  const drawer = document.getElementById("drawer");
  if (!openId) {
    const first = state.store.items.find(item => item.kind === "story") || state.store.items[0];
    if (first) openId = first.id;
  }
  const item = openId ? itemBy(openId) : null;
  if (!item) { drawer.innerHTML = "<p>Нет карточек.</p>"; return; }
  const blocks = blocked(item.id);
  const acceptance = (item.acceptance || []).map(line => `<li>${escapeHtml(line)}</li>`).join("") || "<li>нет сценария</li>";
  const evidence = (item.evidence || []).map(line => `<li>${escapeHtml(line.text || "")}</li>`).join("") || "<li>нет улики</li>";
  const bounds = item.boundaries || {};
  const stages = stagesOf(item.id).map(step => `<li class="pill ${escapeHtml(step.state || "no")}">${escapeHtml(step.name)}: ${escapeHtml(step.state || "")}</li>`).join("");
  const spec = (state.specs || {})[item.kind === "epic" ? item.id : item.parent] || "";
  drawer.innerHTML = `<h2>${escapeHtml(item.id)}</h2><p><strong>${escapeHtml(item.title)}</strong></p>
    <p>${escapeHtml(item.description || "без описания")}</p>
    <div class="row">${STATUSES.map(status => `<button type="button" data-move="${escapeHtml(item.id)}" data-status="${status}" ${item.status === status ? "disabled" : ""}>${status}</button>`).join("")}</div>
    <h3>Цикл</h3><ul>${stages || "<li>нет</li>"}</ul>
    <p class="muted">Дети: ${childrenOf(item.id).map(child => escapeHtml(child.id + " " + child.title)).join("; ") || "нет"}</p>
    <h3>Приёмка</h3><ul>${acceptance}</ul>
    <h3>Гардрейлы</h3>
    <p>Always: ${escapeHtml((bounds.always || []).join(" | ") || "нет")}</p>
    <p>Ask First: ${escapeHtml((bounds.ask_first || []).join(" | ") || "нет")}</p>
    <p>Never: ${escapeHtml((bounds.never || []).join(" | ") || "нет")}</p>
    ${blocks.length ? `<h3>Гейт не пускает</h3><ul>${blocks.map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul>` : "<p>Гейт ready для этой истории молчит, либо это не история.</p>"}
    <h3>Улики и проверки</h3><ul>${evidence}</ul>
    <form id="evidence-form"><div class="row"><input name="text" placeholder="улика: вывод команды" required /><button type="submit">добавить улику</button></div></form>
    ${spec ? `<h3>Спецификация</h3><pre>${escapeHtml(spec)}</pre>` : ""}`;
  const form = document.getElementById("evidence-form");
  if (form) form.addEventListener("submit", event => {
    event.preventDefault();
    call("/api/evidence", {id: item.id, text: new FormData(event.target).get("text")});
  });
}
function draw() {
  const items = state.store.items;
  const stories = items.filter(item => item.kind === "story");
  const openPoints = stories.filter(item => item.status !== "done").reduce((sum, item) => sum + (item.points || 0), 0);
  const donePoints = stories.filter(item => item.status === "done").reduce((sum, item) => sum + (item.points || 0), 0);
  const totalHours = Object.values(state.hours || {}).reduce((sum, value) => sum + Number(value || 0), 0);
  document.getElementById("sub").textContent = state.project + " · " + state.generated;
  const sprintSelect = document.getElementById("sprint");
  const previous = sprintSelect.value;
  sprintSelect.innerHTML = `<option value="">все спринты</option>` + state.store.sprints.map(sprint => `<option value="${escapeHtml(sprint.id)}">${escapeHtml(sprint.id)} ${escapeHtml(sprint.goal || "")}</option>`).join("");
  if ([...sprintSelect.options].some(option => option.value === previous)) sprintSelect.value = previous;
  if (!sprintSelect.value && state.store.sprints[0]) sprintSelect.value = state.store.sprints[0].id;
  document.getElementById("stats").innerHTML = [[items.length,"записей"],[openPoints,"SP открыто"],[donePoints,"SP готово"],[totalHours.toFixed(2),"часов"],[state.store.sprints.length,"спринтов"]].map(([value,label]) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`).join("");
  const gaps = stories.filter(item => stagesOf(item.id).some(step => step.name === "улика" && step.state === "no"));
  document.getElementById("gaps").textContent = gaps.length ? "Без улики, done закрыть нельзя: " + gaps.map(item => item.id).join(", ") : "У каждой истории в выборке есть улика, либо историй нет.";
  const shown = visibleItems();
  const titles = {backlog:"Бэклог", kanban:"Доска", scrum:"Спринт", cycle:"Цикл", architecture:"Архитектура", intake:"Сырьё"};
  document.getElementById("view-title").textContent = titles[view] || view;
  document.querySelectorAll("nav button[id^='view-']").forEach(button => button.classList.toggle("active", button.id === "view-" + view));
  const host = document.getElementById("view");
  if (view === "cycle") {
    const ideas = shown.filter(item => item.kind === "idea");
    const roots = ideas.length ? ideas : shown.filter(item => !item.parent);
    const body = roots.map(idea => {
      const epics = childrenOf(idea.id);
      const blocks = epics.map(epic => `<div class="slice"><strong>${escapeHtml(epic.id)} ${escapeHtml(epic.title)}</strong>${childrenOf(epic.id).map(cardHtml).join("") || "<p>нет карточек</p>"}</div>`).join("");
      return `<section class="slice"><h3>${escapeHtml(idea.id)} ${escapeHtml(idea.title)}</h3>${blocks || "<p>нет эпиков</p>"}</section>`;
    }).join("");
    host.innerHTML = body || "<p>пусто</p>";
  } else if (view === "backlog") {
    host.innerHTML = `<table><thead><tr><th>ID</th><th>Вид</th><th>Статус</th><th>SP</th><th>Часы</th><th>Родитель</th><th>Спринт</th><th>Название</th><th>Дыры</th></tr></thead><tbody>${shown.map(item => `<tr data-open="${escapeHtml(item.id)}"><td>${escapeHtml(item.id)}</td><td>${escapeHtml(item.kind)}</td><td>${escapeHtml(item.status)}</td><td>${item.points == null ? "" : item.points}</td><td>${hoursOf(item.id)}</td><td>${escapeHtml(item.parent || "")}</td><td>${escapeHtml(item.sprint || "")}</td><td>${escapeHtml(item.title)}</td><td>${escapeHtml(stagesOf(item.id).filter(step => step.state === "no").map(step => step.name).join(", "))}</td></tr>`).join("")}</tbody></table>`;
  } else if (view === "scrum") {
    const sprintId = document.getElementById("sprint").value || (state.store.sprints[0] || {}).id || "";
    const sprint = state.store.sprints.find(item => item.id === sprintId);
    const scoped = shown.filter(item => item.kind === "story" && (!sprintId || item.sprint === sprintId));
    const velocity = scoped.filter(item => item.status === "done").reduce((sum, item) => sum + (item.points || 0), 0);
    host.innerHTML = `<p>Цель: ${escapeHtml(sprint ? sprint.goal || "не задана" : "спринта нет")} · velocity ${velocity} · карточек ${scoped.length}</p><div class="board">${STATUSES.map(status => `<section class="col ${status}"><h3>${status}</h3>${scoped.filter(item => item.status === status).map(cardHtml).join("") || "<p>пусто</p>"}</section>`).join("")}</div>`;
  } else if (view === "architecture") {
    host.innerHTML = `<h3>CALM</h3>${state.calm || "<p>схемы нет</p>"}<h3>Sysl</h3>${state.sysl || "<p>схемы нет</p>"}`;
  } else if (view === "intake") {
    host.innerHTML = `<form class="panel" id="intake-form" style="padding:1rem"><p>Одна метка на строку: pain, idea, interview, task, research. Так же по-русски: боль, идея, интервью, задача, исследование.</p><textarea name="text" rows="8" style="width:100%" placeholder="idea: Доска показывает путь от боли до релиза&#10;pain: Трекер показывает только статус" required></textarea><p><button type="submit">разобрать заметки</button></p></form>
      <form id="add-form" class="row"><select name="kind"><option>story</option><option>epic</option><option>idea</option><option>task</option><option>requirement</option><option>adr</option></select><input name="title" placeholder="название" required /><input name="parent" placeholder="родитель" /><input name="points" placeholder="points" /><input name="acceptance" placeholder="Given ... When ... Then ..." /><input name="never" placeholder="Never" /><button type="submit">добавить карточку</button></form>`;
    document.getElementById("intake-form").addEventListener("submit", event => { event.preventDefault(); call("/api/intake", {text: new FormData(event.target).get("text") || ""}); });
    document.getElementById("add-form").addEventListener("submit", event => { event.preventDefault(); const form = new FormData(event.target); call("/api/add", {kind:form.get("kind"), title:form.get("title"), parent:form.get("parent") || null, points:form.get("points") || null, acceptance:form.get("acceptance") || "", never:form.get("never") || ""}); });
  } else {
    host.innerHTML = `<div class="board">${STATUSES.map(status => `<section class="col ${status}"><h3>${status} · ${shown.filter(item => item.status === status).length}</h3>${shown.filter(item => item.status === status).map(cardHtml).join("") || "<p>пусто</p>"}</section>`).join("")}</div>`;
  }
  document.getElementById("mode") && (document.getElementById("mode").textContent = state.live ? "запись включена" : "снимок");
  drawDrawer();
}
document.body.addEventListener("click", event => {
  const move = event.target.closest && event.target.closest("button[data-move]");
  if (move) { event.stopPropagation(); call("/api/move", {id: move.dataset.move, status: move.dataset.status}); return; }
  const open = event.target.closest && event.target.closest("[data-open]");
  if (open) { openId = open.dataset.open; drawDrawer(); }
});
["backlog","kanban","scrum","cycle","architecture","intake"].forEach(name => document.getElementById("view-" + name).addEventListener("click", () => { view = name; draw(); }));
document.getElementById("q").addEventListener("input", draw);
document.getElementById("kind").addEventListener("change", draw);
document.getElementById("sprint").addEventListener("change", draw);
document.getElementById("reload").addEventListener("click", async () => { if (!state.live) { draw(); return; } state = await (await fetch("/api/store")).json(); draw(); });
draw();
</script>
</body>
</html>
