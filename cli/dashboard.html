<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MAZU-ADGILE</title>
<style>
  :root {
    --bg: #f3efe7;
    --ink: #2c2830;
    --muted: #6f6676;
    --card: #fffaf6;
    --line: #eadfd3;
    --sage: #d7ead4;
    --blush: #f6d5d5;
    --lilac: #e4daf6;
    --sand: #f7e7c4;
    --sky: #d5e7f6;
    --shadow: 0 10px 30px rgba(70, 50, 40, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, sans-serif;
    background:
      radial-gradient(1000px 400px at 0% -10%, #f8e7ea, transparent 50%),
      radial-gradient(800px 400px at 100% 0%, #e7f0e4, transparent 46%),
      var(--bg);
    color: var(--ink);
  }
  header, main { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; }
  header { padding: 1.6rem 0 0.4rem; display: flex; justify-content: space-between; gap: 1rem; align-items: end; }
  h1 { font-weight: 560; font-size: 2rem; margin: 0; letter-spacing: -0.03em; }
  h2 { font-size: 1.05rem; font-weight: 560; margin: 1.4rem 0 0.6rem; }
  p { color: var(--muted); }
  button, input, select {
    font: inherit;
    color: var(--ink);
    border: 1px solid transparent;
    background: white;
    border-radius: 999px;
    padding: 0.45rem 0.8rem;
    box-shadow: var(--shadow);
  }
  button { cursor: pointer; }
  button:hover { background: #fff4ea; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.7rem; margin-top: 1rem; }
  .stat { background: var(--card); border-radius: 18px; padding: 0.9rem 1rem; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 1.6rem; }
  .stat span { color: var(--muted); font-size: 0.85rem; }
  .bars { background: var(--card); border-radius: 18px; padding: 1rem; box-shadow: var(--shadow); }
  .bar { display: grid; grid-template-columns: 88px 1fr 48px; gap: 0.6rem; align-items: center; margin: 0.45rem 0; }
  .track { background: #f3ebe3; border-radius: 999px; height: 14px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.7rem; }
  .col { background: rgba(255,250,246,0.72); border-radius: 18px; padding: 0.7rem; min-height: 180px; }
  .col h3 { margin: 0.2rem 0.3rem 0.6rem; font-size: 0.92rem; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 0.75rem;
    margin-bottom: 0.55rem;
    box-shadow: var(--shadow);
  }
  .card .id { color: var(--muted); font-size: 0.78rem; }
  .meta { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.4rem 0; }
  .pill { border-radius: 999px; padding: 0.1rem 0.45rem; font-size: 0.75rem; background: var(--sand); }
  .backlog { background: var(--sand); }
  .ready { background: var(--sky); }
  .in-progress { background: var(--lilac); }
  .review { background: var(--blush); }
  .done { background: var(--sage); }
  form.panel, .note {
    background: var(--card);
    border-radius: 18px;
    padding: 0.8rem;
    box-shadow: var(--shadow);
    margin-top: 0.8rem;
  }
  #toast { position: fixed; bottom: 1rem; right: 1rem; background: #2c2830; color: #fffaf6; padding: 0.7rem 0.9rem; border-radius: 14px; display: none; max-width: 320px; }
  @media (max-width: 900px) {
    .stats, .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>MAZU-ADGILE</h1>
    <p id="sub"></p>
  </div>
  <div class="row">
    <input id="q" placeholder="поиск" />
    <select id="kind">
      <option value="">все виды</option>
      <option>idea</option><option>epic</option><option>story</option>
      <option>task</option><option>requirement</option><option>adr</option>
    </select>
    <button id="reload" type="button">обновить</button>
  </div>
</header>
<main>
  <section class="stats" id="stats"></section>
  <h2>Сложность и время</h2>
  <section class="bars" id="bars"></section>
  <h2>Доска</h2>
  <section class="board" id="board"></section>
  <h2>Действия</h2>
  <form class="panel" id="add-form">
    <div class="row">
      <select name="kind">
        <option>story</option><option>epic</option><option>idea</option>
        <option>task</option><option>requirement</option><option>adr</option>
      </select>
      <input name="title" placeholder="название" required />
      <input name="parent" placeholder="родитель" />
      <input name="points" placeholder="points 1–21" inputmode="numeric" />
      <button type="submit">добавить</button>
    </div>
  </form>
  <form class="panel" id="log-form">
    <div class="row">
      <input name="id" placeholder="US-001" required />
      <input name="hours" placeholder="часы" required />
      <input name="note" placeholder="заметка" />
      <button type="submit">записать часы</button>
    </div>
  </form>
  <form class="panel" id="sprint-form">
    <div class="row">
      <input name="goal" placeholder="цель спринта" required />
      <button type="submit">новый спринт</button>
    </div>
  </form>
  <p class="note" id="mode"></p>
</main>
<div id="toast"></div>
<script id="boot" type="application/json">__BOOT__</script>
<script>
const STATUSES = ["backlog", "ready", "in-progress", "review", "done"];
const boot = JSON.parse(document.getElementById("boot").textContent);
let state = boot;

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, 2400);
}

async function call(path, body) {
  if (!state.live) {
    toast("Это снимок. Для кнопок: python3 cli/mazu.py serve");
    return;
  }
  const response = await fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  const payload = await response.json();
  if (!response.ok) {
    toast(payload.error || "ошибка");
    return;
  }
  state = payload;
  draw();
}

function hoursOf(id) {
  return Number(state.hours[id] || 0);
}

function visibleItems() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const kind = document.getElementById("kind").value;
  return state.store.items.filter(item => {
    if (kind && item.kind !== kind) return false;
    if (!q) return true;
    return (item.id + " " + item.title).toLowerCase().includes(q);
  });
}

function draw() {
  const items = state.store.items;
  const stories = items.filter(item => item.kind === "story");
  const openPoints = stories.filter(item => item.status !== "done").reduce((sum, item) => sum + (item.points || 0), 0);
  const donePoints = stories.filter(item => item.status === "done").reduce((sum, item) => sum + (item.points || 0), 0);
  const totalHours = Object.values(state.hours).reduce((sum, value) => sum + Number(value || 0), 0);
  document.getElementById("sub").textContent =
    "Проект " + state.project + " · " + state.generated + " · points — сложность, часы — потраченное время";
  document.getElementById("stats").innerHTML = [
    [items.length, "записей"],
    [openPoints, "SP открыто"],
    [donePoints, "SP готово"],
    [totalHours.toFixed(2), "часов"],
    [state.store.sprints.length, "спринтов"]
  ].map(([value, label]) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`).join("");
  const max = Math.max(openPoints, donePoints, totalHours, 1);
  const bars = [
    ["SP открыто", openPoints, "var(--sand)"],
    ["SP готово", donePoints, "var(--sage)"],
    ["Часы", totalHours, "var(--lilac)"]
  ];
  document.getElementById("bars").innerHTML = bars.map(([label, value, color]) => `
    <div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${Math.round(value / max * 100)}%;background:${color}"></div></div><b>${Number(value).toFixed(value % 1 ? 2 : 0)}</b></div>
  `).join("");
  const shown = visibleItems();
  document.getElementById("board").innerHTML = STATUSES.map(status => {
    const cards = shown.filter(item => item.status === status).map(item => {
      const index = STATUSES.indexOf(status);
      const prev = STATUSES[index - 1];
      const next = STATUSES[index + 1];
      return `<article class="card">
        <div class="id">${escapeHtml(item.id)} · ${escapeHtml(item.kind)}</div>
        <strong>${escapeHtml(item.title)}</strong>
        <div class="meta">
          <span class="pill ${status}">${status}</span>
          <span class="pill">${item.points == null ? "без SP" : item.points + " SP"}</span>
          <span class="pill">${hoursOf(item.id)} ч</span>
          ${item.sprint ? `<span class="pill">${escapeHtml(item.sprint)}</span>` : ""}
        </div>
        <div class="row">
          <button type="button" ${prev ? "" : "disabled"} data-move="${escapeHtml(item.id)}" data-status="${prev || ""}">←</button>
          <button type="button" ${next ? "" : "disabled"} data-move="${escapeHtml(item.id)}" data-status="${next || ""}">→</button>
        </div>
      </article>`;
    }).join("");
    return `<section class="col ${status}"><h3>${status} · ${shown.filter(item => item.status === status).length}</h3>${cards || "<p>пусто</p>"}</section>`;
  }).join("");
  document.getElementById("mode").textContent = state.live
    ? "Кнопки пишут в локальный store этого проекта."
    : "Снимок файла. Интерактивные изменения: python3 cli/mazu.py serve";
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, char => ({"&":"&","<":"<",">":">","\"":"""}[char]));
}

document.getElementById("board").addEventListener("click", event => {
  const button = event.target.closest("button[data-move]");
  if (!button || !button.dataset.status) return;
  call("/api/move", {id: button.dataset.move, status: button.dataset.status});
});
document.getElementById("q").addEventListener("input", draw);
document.getElementById("kind").addEventListener("change", draw);
document.getElementById("reload").addEventListener("click", async () => {
  if (!state.live) { draw(); return; }
  state = await (await fetch("/api/store")).json();
  draw();
});
document.getElementById("add-form").addEventListener("submit", event => {
  event.preventDefault();
  const form = new FormData(event.target);
  call("/api/add", {
    kind: form.get("kind"),
    title: form.get("title"),
    parent: form.get("parent") || null,
    points: form.get("points") || null
  });
  event.target.reset();
});
document.getElementById("log-form").addEventListener("submit", event => {
  event.preventDefault();
  const form = new FormData(event.target);
  call("/api/log", {id: form.get("id"), hours: Number(form.get("hours")), note: form.get("note") || ""});
});
document.getElementById("sprint-form").addEventListener("submit", event => {
  event.preventDefault();
  const form = new FormData(event.target);
  call("/api/sprint", {goal: form.get("goal")});
});
draw();
</script>
</body>
</html>
